:root{--red:#e3121c;--ink:#f6f3f0;--mute:rgba(246,243,240,.6)}
html,body{margin:0;height:100%;overflow:hidden;color:var(--ink);font:400 15px/1.5 Outfit,system-ui,sans-serif;
 background:radial-gradient(70% 55% at 50% 42%,rgba(150,10,16,.6),rgba(60,4,8,.35) 45%,transparent 75%),linear-gradient(180deg,#160305,#0b0406 70%)}
canvas{display:block;position:fixed;inset:0;touch-action:pan-y}
html.emb,html.emb body{background:transparent}.emb .top,.emb .lbl,.emb .tick{display:none}.emb .bot{bottom:14px}

.top{position:fixed;inset:0 0 auto;display:flex;justify-content:space-between;align-items:center;padding:18px clamp(18px,5vw,72px);z-index:2}
.logo{display:grid;justify-items:center;gap:4px;width:92px}.logo svg{width:100%;height:auto}.logo .st{width:62%}
.top a{color:var(--mute);font-size:14px;text-decoration:none}.top a:hover{color:#fff}
.lbl{position:fixed;left:0;right:0;top:11vh;text-align:center;z-index:2;pointer-events:none}
.lbl small{display:block;font:600 11px/1 Outfit;letter-spacing:.42em;color:var(--red);text-transform:uppercase}
.lbl h1{margin:10px 0 0;font:400 clamp(40px,5.6vw,78px)/.95 Anton,sans-serif;text-transform:uppercase}.lbl h1 em{font-style:normal;color:var(--red)}
.bot{position:fixed;left:0;right:0;bottom:64px;text-align:center;z-index:2;transition:opacity .4s}
.bot p{margin:0;color:var(--mute);font-size:14px}
.bot a{display:inline-flex;gap:8px;align-items:center;margin-top:14px;height:46px;padding:0 22px;border-radius:12px;background:var(--red);color:#fff;font-weight:600;text-decoration:none;box-shadow:0 10px 30px rgba(227,18,28,.4)}
.tick{position:fixed;left:0;right:0;bottom:0;background:var(--red);color:#0b0406;overflow:hidden;z-index:2}
.tick div{display:flex;width:max-content;animation:tk 28s linear infinite}
.tick span{padding:10px 26px;font:400 18px/1 Anton,sans-serif;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap}
.tick span::after{content:'✦';margin-left:52px;opacity:.7}
@keyframes tk{to{transform:translateX(-50%)}}
.info{position:fixed;right:6vw;top:50%;transform:translate(20px,-50%);width:min(340px,40vw);opacity:0;transition:.45s;pointer-events:none;z-index:3;padding:22px 22px 18px;border-radius:20px;background:rgba(14,14,15,.82);border:1px solid rgba(255,255,255,.09);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.info.on{opacity:1;transform:translate(0,-50%);pointer-events:auto}
.info small{display:block;color:#8d8d8d;font:500 11px/1 Outfit;letter-spacing:.12em}
.info h2{margin:8px 0 0;font:600 24px/1.15 Outfit,sans-serif;letter-spacing:-.01em}
.info p{color:#b4b4b4;margin:8px 0 14px;font-size:13.5px;line-height:1.5}
.info .cl{position:absolute;top:16px;right:18px;background:none;border:0;color:#9a9a9a;font:500 12px/1 Outfit;cursor:pointer}.info .cl:hover{color:#fff}
.tabs{display:flex;gap:18px;border-bottom:1px solid rgba(255,255,255,.1);margin-bottom:14px}.tabs button{background:none;border:0;padding:0 0 9px;color:#8a8a8a;font:500 13px/1 Outfit;cursor:pointer;border-bottom:1.5px solid transparent;margin-bottom:-1px}.tabs button.on{color:#fff;border-color:#fff}
.lab{display:block;color:#8a8a8a;font:500 10.5px/1 Outfit;letter-spacing:.14em;text-transform:uppercase;margin-bottom:9px}
.sz{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:16px}.sz button{min-width:40px;height:40px;padding:0 10px;border-radius:999px;border:1px solid rgba(255,255,255,.18);background:none;color:#e9e9e9;font:500 12.5px/1 Outfit;cursor:pointer;transition:.2s}.sz button:hover{border-color:#fff}.sz button.on{background:#f4f2ef;color:#0a0a0a;border-color:#f4f2ef}
.info .go{display:flex;align-items:center;justify-content:center;height:46px;border-radius:999px;background:#f4f2ef;color:#0a0a0a;text-decoration:none;font:600 14px/1 Outfit;transition:.2s}.info .go:hover{background:#fff}
.foot{display:flex;justify-content:space-between;gap:10px;margin-top:14px;padding-top:12px;border-top:1px solid rgba(255,255,255,.08);font-size:12px;color:#9a9a9a}.foot a{color:#e6e6e6;text-decoration:none}
.amb{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.amb .spot{position:absolute;left:50%;top:-10%;width:min(1100px,120vw);height:95%;transform:translateX(-50%);background:radial-gradient(50% 60% at 50% 0%,rgba(255,255,255,.13),rgba(255,255,255,.04) 45%,transparent 72%);filter:blur(4px)}
.amb .wm{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);font:400 clamp(160px,30vw,420px)/.8 Anton,sans-serif;color:transparent;-webkit-text-stroke:1px rgba(255,255,255,.07);letter-spacing:-.01em;white-space:nowrap}
.amb .floor{position:absolute;left:50%;bottom:9%;width:min(1000px,96vw);height:120px;transform:translateX(-50%);border-radius:50%;background:radial-gradient(closest-side,rgba(0,0,0,.65),transparent)}
.amb .neonf{position:absolute;left:50%;bottom:calc(9% + 54px);width:min(820px,80vw);height:2px;transform:translateX(-50%);background:#ff2a36;border-radius:2px;box-shadow:0 0 14px 3px rgba(255,30,40,.75),0 0 60px 10px rgba(255,30,40,.25);animation:nf 5s ease-in-out infinite}
@keyframes nf{0%,100%{opacity:.85}50%{opacity:1}}
canvas{z-index:1}
.dim .bot,.dim .lbl{opacity:0}.lbl{transition:opacity .4s}

function fit(){const w=innerWidth,h=innerHeight;r.setSize(w,h);cam.aspect=w/h;
  const fovH=2*Math.atan(Math.tan(THREE.MathUtils.degToRad(cam.fov/2))*cam.aspect);
  const half=w<760?((N-1)*GAP/2+SW*.42):(LEN/2+.2);const dist=Math.max(half/Math.tan(fovH/2),SH*(w<760?3.2:3.6));const cy=RY-SH*.62;cam.position.set(0,cy+.1,dist);cam.lookAt(0,cy,0);cam.updateProjectionMatrix();}

/* camiseta: forma real do contorno, com volume e borda arredondada */
const tl=new THREE.TextureLoader();
const tex=u=>{const t=tl.load(u);t.encoding=THREE.sRGBEncoding;t.anisotropy=8;return t;};
function shirtGeo(pts){
  const sh=new THREE.Shape(pts.map(([x,y])=>new THREE.Vector2((x-.5)*SW,(.5-y)*SH)));
  const g0=new THREE.ExtrudeGeometry(sh,{depth:D,bevelEnabled:true,bevelThickness:.012,bevelSize:.008,bevelSegments:3,curveSegments:1});
  g0.translate(0,0,-D/2);
  const p=g0.attributes.position.array,G=[[],[],[]],A=new THREE.Vector3(),B=new THREE.Vector3(),C=new THREE.Vector3(),n=new THREE.Vector3();
  for(let i=0;i<p.length;i+=9){A.fromArray(p,i);B.fromArray(p,i+3);C.fromArray(p,i+6);
    n.subVectors(C,B).cross(B.clone().sub(A)).normalize();n.negate();
    G[n.z>.75?0:n.z<-.75?1:2].push(...p.slice(i,i+9));}
  const pos=new Float32Array([...G[0],...G[1],...G[2]]),nv=pos.length/3,uv=new Float32Array(nv*2),nor=new Float32Array(nv*3);
  const n0=G[0].length/3,n1=G[1].length/3;
  // normais: tampa reta, lateral suavizada (sem facetas)
  const acc=new Map(),key=(x,y,z)=>`${x.toFixed(4)},${y.toFixed(4)},${z.toFixed(4)}`;
  for(let v=n0+n1;v<nv;v+=3){A.fromArray(pos,v*3);B.fromArray(pos,v*3+3);C.fromArray(pos,v*3+6);
    n.subVectors(C,B).cross(B.clone().sub(A));n.negate();
    for(let k=0;k<3;k++){const q=key(pos[(v+k)*3],pos[(v+k)*3+1],pos[(v+k)*3+2]);const o=acc.get(q)||[0,0,0];o[0]+=n.x;o[1]+=n.y;o[2]+=n.z;acc.set(q,o);}}
  for(let v=0;v<nv;v++){const x=pos[v*3],y=pos[v*3+1],z=pos[v*3+2],u=(x+SW/2)/SW;
    uv[v*2]=v<n0?u:1-u;uv[v*2+1]=(y+SH/2)/SH;
    if(v<n0){nor[v*3+2]=1}else if(v<n0+n1){nor[v*3+2]=-1}else{const o=acc.get(key(x,y,z)),l=Math.hypot(...o)||1;nor[v*3]=o[0]/l;nor[v*3+1]=o[1]/l;nor[v*3+2]=o[2]/l;}}
  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(pos,3));g.setAttribute('uv',new THREE.BufferAttribute(uv,2));g.setAttribute('normal',new THREE.BufferAttribute(nor,3));
  for(let v=0;v<nv;v++){const x=pos[v*3],y=pos[v*3+1],sz=Math.sign(pos[v*3+2])||1;
    const bx=Math.max(0,1-Math.pow(x/(SW*.42),2)),by=Math.min(1,Math.max(0,(SH*.5-Math.abs(y+SH*.05))/(SH*.18)));
    pos[v*3+2]+=sz*.045*Math.sqrt(bx)*by; if(v<n0+n1){nor[v*3]+=-sz*x*.35;} }
  g.addGroup(0,n0,0);g.addGroup(n0,n1,1);g.addGroup(n0+n1,nv-n0-n1,2);g.userData.base=pos.slice();return g;
}
const wood=new THREE.MeshStandardMaterial({color:0x1b1b1b,roughness:.45,metalness:.35}),steel=new THREE.MeshStandardMaterial({color:0x9a9a9a,metalness:.9,roughness:.3});
function hanger(){
  const g=new THREE.Group();
  const bar=new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3([new THREE.Vector3(-.62,-.36,0),new THREE.Vector3(0,-.15,0),new THREE.Vector3(.62,-.36,0)]),24,.028,8),wood);g.add(bar);
  const hk=new THREE.Mesh(new THREE.TorusGeometry(.055,.008,8,20,Math.PI*1.35),steel);hk.rotation.z=-.4;hk.position.y=.015;g.add(hk);
  const n=new THREE.Mesh(new THREE.CylinderGeometry(.008,.008,.12,6),steel);n.position.y=-.075;g.add(n);return g;
}
const PROF=1.0;   // 3/4: dá para ver a estampa já na arara           // de perfil
const items=DATA.map((d,i)=>{
  const pivot=new THREE.Group(),body=new THREE.Group();
  const mats=[d.f,d.b].map(u=>new THREE.MeshStandardMaterial({map:tex(u),roughness:.95,metalness:0}));mats.push(new THREE.MeshStandardMaterial({color:new THREE.Color(`rgb(${d.c.join(',')})`).convertSRGBToLinear(),roughness:.95}));
  const mesh=new THREE.Mesh(shirtGeo(d.p),mats);mesh.userData.i=i;body.add(mesh);body.position.y=-.2-SH/2;
  pivot.add(body,hanger());scene.add(pivot);
  const x=(i-(N-1)/2)*GAP;pivot.position.set(x,RY,0);
  return {d,i,pivot,mesh,mats,x,
    ry:PROF,ryv:0,sw:0,swv:0,px:x,pxv:0,pz:0,pzv:0,py:RY,pyv:0,ph:Math.random()*6};
});
const meshes=items.map(it=>it.mesh);

/* interação */
const ray=new THREE.Raycaster(),mp=new THREE.Vector2(9,9);let tilt=0,spinV=0,hov=-1,sel=-1,ang=0,drag=null,lastX=0,mvx=0;
const pick=()=>{ray.setFromCamera(mp,cam);const h=ray.intersectObjects(meshes);return h.length?h[0].object.userData.i:-1;};
addEventListener('pointermove',e=>{if(drag&&sel<0&&drag.i>=0&&Math.abs(e.clientX-drag.x)>10){open(drag.i);drag.opened=true;drag.x=e.clientX;drag.y=e.clientY;}mp.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1);mvx=e.clientX-lastX;lastX=e.clientX;
  if(drag&&sel>=0){const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.abs(dx)+Math.abs(dy)>3)drag.m=true;const k=Math.PI*2.2/Math.min(innerWidth,900);ang+=dx*k;spinV=dx*k*60;tilt=Math.max(-.45,Math.min(.45,tilt+dy*k*.6));drag.x=e.clientX;drag.y=e.clientY;}});
addEventListener('pointerdown',e=>{spinV=0;if(e.target.closest('.info'))return;hold=false;if(e.target.closest('a,button'))return;mp.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1);drag={x:e.clientX,y:e.clientY,m:false,i:sel<0?pick():-1};if(e.pointerType==='mouse'&&drag.i>=0){open(drag.i);drag.opened=true;}});
addEventListener('pointerup',()=>{if(drag&&!drag.m&&!drag.opened){const i=pick();if(sel<0&&i>=0)open(i);else if(sel>=0&&i!==sel)close();}drag=null;});addEventListener('pointercancel',()=>drag=null);
const $=s=>document.getElementById(s);
function open(i){sel=i;ang=0;hold=false;size='';$('i-t2').textContent=DATA[i].name;tabs(0);$('i-s').innerHTML=SIZES.map(z=>`<button type="button">${z}</button>`).join('');const d=DATA[i];$('i-n').textContent=String(i+1).padStart(2,'0')+' / '+String(N).padStart(2,'0');$('i-t').textContent=d.name;$('i-d').textContent=DESC[i]||'';
  link();$('info').classList.add('on');document.body.classList.add('dim');}
const SIZES=['P','M','G','GG','XG'];let size='',hold=false,holdA=0;
const WA=(()=>{try{return parent.MUD_WA||''}catch(e){return ''}})();
function link(){const d=DATA[sel];if(!d)return;const t=`Olá! Vim pelo site da MÜD Store e gostei da camiseta "${d.name}"`+(size?` no tamanho ${size}.`:'.')+' Ainda tem disponível?';$('i-w').href=(WA?`https://wa.me/${WA}?text=`:'https://api.whatsapp.com/send?text=')+encodeURIComponent(t);$('i-w').textContent=size?`Pedir tamanho ${size} no WhatsApp`:'Pedir no WhatsApp';}
function tabs(b){$('i-f').classList.toggle('on',!b);$('i-b').classList.toggle('on',!!b);}
$('i-s').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;size=b.textContent;[...$('i-s').children].forEach(x=>x.classList.toggle('on',x===b));link();});
$('i-f').onclick=()=>{hold=true;holdA=Math.round(ang/(2*Math.PI))*2*Math.PI;tabs(0);};
$('i-b').onclick=()=>{hold=true;holdA=Math.round((ang-Math.PI)/(2*Math.PI))*2*Math.PI+Math.PI;tabs(1);};
function close(){sel=-1;tilt=0;$('info').classList.remove('on');document.body.classList.remove('dim');}
$('i-x').onclick=close;addEventListener('keydown',e=>e.key==='Escape'&&close());

/* física simples: molas com leve sobressalto = movimento natural */
const spring=(it,k,tg,K,C,dt)=>{const a=K*(tg-it[k])-C*it[k+'v'];it[k+'v']+=a*dt;it[k]+=it[k+'v']*dt;};
const clk=new THREE.Clock();let prevHov=-1;
const mob=()=>innerWidth<760;
(function loop(){
  const dt=Math.min(clk.getDelta(),.033),t=clk.elapsedTime;
  hov=sel<0?pick():-1;document.body.style.cursor=hov>=0?'pointer':(sel>=0?'grab':'default');
  if(hov>=0&&hov!==prevHov)items[hov].swv+=THREE.MathUtils.clamp(mvx,-30,30)*.02;   // empurrãozinho ao passar
  if(hov>=0&&hov===prevHov)items[hov].swv+=THREE.MathUtils.clamp(mvx,-20,20)*.0025;
  prevHov=hov;mvx*=.6;
  if(sel>=0&&!drag){if(hold){ang+=(holdA-ang)*.1;spinV=0;}else{ang+=spinV*dt;spinV+=(.45-spinV)*Math.min(1,dt*2.2);}const c=((ang%(2*Math.PI))+2*Math.PI)%(2*Math.PI);tabs(c>Math.PI/2&&c<Math.PI*1.5);}
  items.forEach(it=>{
    const i=it.i,isH=i===hov,isS=i===sel;
    // rotação (perfil -> frente)
    const tr=isS?ang:(isH?0.18:PROF);if(isS&&drag){it.ry=tr;it.ryv=0;}else spring(it,'ry',tr,isS?60:55,isS?13:7.5,dt);

    let tx=it.x;if(hov>=0&&!isH){const s=Math.sign(i-hov),k=Math.abs(i-hov);tx+=s*.35*Math.exp(-(k-1)*.9);}
    if(isS)tx=mob()?0:-.9;
    spring(it,'px',tx,40,9,dt);
    spring(it,'pz',isS?(mob()?cam.position.z-SH*6.4:1.3):(isH?.45:(sel>=0?-6:0)),40,10,dt);
    spring(it,'py',isS?(mob()?RY+SH*.42:RY+.02):RY,40,10,dt);
    // pêndulo (balanço do cabide)
    spring(it,'sw',0,14,1.6,dt);
    const idle=Math.sin(t*.8+it.ph)*.012;
    it.dim=(it.dim||1)+(((sel>=0&&!isS)?.18:1)-(it.dim||1))*.08;it.mats.forEach(m=>{m.userData.c0=m.userData.c0||m.color.clone();m.color.copy(m.userData.c0).multiplyScalar(it.dim);});
    it.pivot.position.set(it.px,it.py,it.pz);
    if(!isS||!drag)it.tl=(it.tl||0)+(((isS?tilt:0))-(it.tl||0))*.12;else it.tl=tilt;if(!drag&&isS)tilt*=.96;it.pivot.rotation.set(it.tl||0,it.ry,it.sw+idle);

    const g=it.mesh.geometry,p=g.attributes.position.array,b=g.userData.base,lag=it.swv*.9+it.ryv*.05;
    if(Math.abs(lag)>.002||it.bent){
      for(let v=0;v<p.length;v+=3){const low=Math.max(0,(SH/2-b[v+1])/SH),q=low*low;p[v]=b[v]-lag*q*.35;p[v+2]=b[v+2]+Math.sin(t*3+b[v+1]*3)*q*Math.abs(lag)*.25;}
      g.attributes.position.needsUpdate=true;it.bent=Math.abs(lag)>.002;
    }
  });
  r.render(scene,cam);requestAnimationFrame(loop);
})();
