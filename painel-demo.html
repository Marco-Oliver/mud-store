/* Layout compacto: funcionalidade original preservada */
:root{--bg:#f8f8fa;--sidebar:#070708;--radius:14px;--shadow:0 1px 2px rgba(20,20,22,.035),0 5px 13px rgba(20,20,22,.048)}
body{font-size:13px;background:#f8f8fa}
.sidebar{width:208px;flex-basis:208px;background:#070708;padding:16px 10px 13px}
.brand{padding:0 12px 13px;border-bottom-color:#252525}
.brand-logo{height:68px;width:124px;max-width:124px;margin:0 auto -5px;object-fit:contain}
.brand-commerce{font-size:14px;line-height:1.08;font-weight:740}
.brand-by{font-size:10px;margin-top:4px;color:#bababa}.brand-by b{font-size:11px}
.sidebar-nav{margin-top:15px;gap:2px}
.nav-btn{min-height:39px;font-size:12.5px;padding:0 12px;gap:11px;border-radius:9px}.nav-btn svg{width:18px;height:18px}
.nav-divider{margin:9px 12px}
.sidebar-footer{padding:12px 5px 0;gap:9px}.sidebar-user-avatar{width:33px;height:33px;font-size:16px}.sidebar-footer strong{font-size:12px}.sidebar-footer small{font-size:10px}
.topbar{height:56px;padding:0 clamp(17px,2vw,30px);gap:10px;background:#f8f8fa;backdrop-filter:none}
.searchbox{height:36px;max-width:700px;border-radius:10px;padding:0 12px}.searchbox input{font-size:12px}
.page-content{padding:18px clamp(17px,2vw,30px) 24px;max-width:1760px}
.page-intro{margin-bottom:15px}.page-intro h1{font-size:30px;font-weight:760;line-height:1.1}.page-intro p{font-size:13px;margin:4px 0 0}
.shortcut-grid{gap:8px;margin-bottom:12px;grid-template-columns:repeat(7,minmax(0,1fr))}
.shortcut{height:88px;gap:8px;padding:9px 4px;border-radius:13px;font-size:12px;line-height:1.18;box-shadow:var(--shadow)}
.shortcut .icon{height:24px;width:24px}
.home-grid{gap:11px;grid-template-columns:minmax(0,1.09fr) minmax(0,1fr)}
.panel{border-radius:14px}.panel-title{padding:12px 14px 7px}.panel-title h2{font-size:16px;gap:8px}.panel-title h2 .icon{width:20px;height:20px}
.count-pill{min-width:22px;height:22px;font-size:11px}
.order-preview{padding:0 14px 7px}
.order-line{grid-template-columns:53px minmax(65px,1.1fr) 47px minmax(72px,1fr) 16px;gap:6px;padding:5px 1px;min-height:35px;font-size:11px}
.status{font-size:10px;padding:4px 7px}
.product-alerts{padding:0 14px 7px}.stock-line{gap:9px;min-height:49px;padding:5px 0}

function notify(){const n=document.getElementById('side-nav');n.innerHTML=routes.map((r,i)=>`${i===6?'<div class="nav-divider"></div>':''}<button class="nav-btn ${state.page===r[0]?'active':''}" data-page="${r[0]}">${icon(r[2])}<span>${r[1]}</span>${r[0]==='pedidos'?`<span class="nav-count">${countActive()}</span>`:''}</button>`).join('')}
function header(title,subtitle,actions=''){return `<div class="page-intro"><div><h1>${title}</h1><p>${subtitle}</p></div>${actions?`<div class="header-actions">${actions}</div>`:''}</div>`}
function actionBtn(title,action,ico='plus',extra=''){return `<button class="btn ${extra}" data-action="${action}">${icon(ico)} ${title}</button>`}
function panelTitle(text,ico,to,label='Ver todos'){return `<div class="panel-title"><h2>${icon(ico)}${text}</h2>${to?`<button class="text-link" data-page="${to}">${label} ${icon('chevron')}</button>`:''}</div>`}
function statusBadge(s){const c=s==='Separado'?'ready':s==='Enviado'?'sent':'pending';return `<span class="status ${c}"><span class="dot"></span>${esc(s)}</span>`}
function productThumb(p){let im=p?.imageData||(p?.img&&MEDIA[p.img]);return `<span class="thumb">${im?`<img src="${im}" alt="">`:icon(p?.category==='Camisetas'?'shirt':p?.category==='Bonés'?'tag':'box')}</span>`}
function ordersHome(){return `<section class="panel">${panelTitle(`Pedidos do dia <span class="count-pill">${countActive()}</span>`,'orders','pedidos')}<div class="order-preview">${db.orders.filter(o=>o.status!=='Enviado').slice(0,5).map(o=>`<div class="order-line click-row" data-order="${esc(o.id)}"><strong>${esc(o.id)}</strong><span class="name">${esc(o.client)}</span><span>${o.pieces} ${o.pieces===1?'peça':'peças'}</span><span>${statusBadge(o.status)}</span>${icon('chevron','small-icon muted')}</div>`).join('')||'<div class="empty">Nenhum pedido pendente.</div>'}</div></section>`}
function lowStock(){return db.products.filter(p=>Number(p.stock)<=Number(p.min)).sort((a,b)=>a.stock-b.stock)}
function stockHome(){return `<section class="panel">${panelTitle('Estoque com atenção','alert','estoque','Ver todos')}<div class="product-alerts">${lowStock().slice(0,3).map(p=>`<div class="stock-line click-row" data-stock="${esc(p.id)}">${productThumb(p)}<span class="stock-description"><strong>${esc(p.name)}</strong><small>Tam. ${esc(p.size)} · ${p.stock} unid.</small></span><span class="low-tag">Baixo</span></div>`).join('')||'<div class="empty">Nenhum produto abaixo do mínimo. ✓</div>'}</div></section>`}
function movementsHome(){return `<section class="panel">${panelTitle('Movimentações recentes','clock','entradas','Ver histórico')}<div class="movement-list">${db.movements.slice(0,3).map(m=>`<div class="movement-row"><span class="movement-icon ${m.type==='saida'?'down':m.type==='pedido'?'order':''}">${icon(m.type==='entrada'?'up':m.type==='saida'?'down':'orders')}</span><div class="movement-content"><strong>${esc(m.description)}</strong><p>${esc(m.name)} · ${m.qty} ${m.qty===1?'unidade':'unidades'}</p></div><span class="movement-time">${esc(m.time)}</span></div>`).join('')||'<div class="empty">Nenhuma movimentação cadastrada.</div>'}</div></section>`}
function catsStats(){const v={};db.products.forEach(p=>v[p.category]=(v[p.category]||0)+Number(p.stock));return Object.entries(v).sort((a,b)=>b[1]-a[1])}
function chartHtml(){const cats=catsStats(),total=cats.reduce((s,[,v])=>s+v,0);let cumulative=0;const grad=cats.map(([,v],i)=>{let s=total?cumulative/total*100:0;cumulative+=v;let e=total?cumulative/total*100:100;return `${CATEGORIES_COLORS[i%CATEGORIES_COLORS.length]} ${s}% ${e}%`}).join(',');return `<section class="panel">${panelTitle('Estoque por categoria','layers','estoque','Ver detalhes')}<div class="chart-content"><div class="donut" style="background:conic-gradient(${grad||'#e8e9ed 0 100%'})"><div class="donut-label"><strong>${total}</strong><span>itens</span></div></div><div class="legend">${cats.slice(0,6).map(([cat,v],i)=>`<div class="legend-row" data-cat="${esc(cat)}"><span class="legend-name"><span class="legend-swatch" style="background:${CATEGORIES_COLORS[i%CATEGORIES_COLORS.length]}"></span>${esc(cat)}</span><span class="legend-count"><b>${v} un.</b> <span class="muted">(${total?Math.round(v/total*100):0}%)</span></span></div>`).join('')}</div></div></section>`}
function home(){const quick=[['Cadastrar produto','productNew','box'],['Gerenciar pedidos','nav:pedidos','orders'],['Controle de estoque','nav:estoque','layers'],['Registrar entrada','entryNew','down'],['Categorias','nav:categorias','tag'],['Tamanhos e cores','nav:tamanhos','shirt'],['Fornecedores','nav:fornecedores','people']];return `${header('Olá, Hamud!','Bem-vindo ao painel da MÜD Store')}<div class="shortcut-grid">${quick.map(q=>`<button class="shortcut" data-action="${q[1]}">${icon(q[2])}<span>${q[0].replace(' ','<br>')}</span></button>`).join('')}</div><div class="home-grid">${ordersHome()}${stockHome()}${movementsHome()}${chartHtml()}</div><p class="footer-hint">Protótipo demonstrativo · Alterações realizadas nesta tela ficam salvas neste navegador.</p>`}
function ordersPage(){const t=state.orderTab;let os=db.orders.filter(o=>t==='Todos'||o.status===t).filter(o=>!state.search||(o.client+' '+o.id+' '+o.status).toLowerCase().includes(state.search.toLowerCase()));return `${header('Pedidos','Acompanhe a separação e o envio dos pedidos da loja.',actionBtn('Exportar pedidos','exportOrders','download'))}<div class="stat-strip"><div class="stat" data-filter-order="A separar"><span>A separar</span><strong>${db.orders.filter(o=>o.status==='A separar').length}</strong></div><div class="stat" data-filter-order="Separado"><span>Separados</span><strong>${db.orders.filter(o=>o.status==='Separado').length}</strong></div><div class="stat" data-filter-order="Enviado"><span>Enviados</span><strong>${db.orders.filter(o=>o.status==='Enviado').length}</strong></div></div><div class="table-controls"><div class="tabs">${['Todos','A separar','Separado','Enviado'].map(t=>`<button class="tab ${t===state.orderTab?'active':''}" data-filter-order="${t}">${t}</button>`).join('')}</div></div><section class="panel table-panel"><table class="table"><thead><tr><th>Pedido</th><th>Cliente</th><th>Peças</th><th>Status</th><th>Próximo passo</th></tr></thead><tbody>${os.map(o=>`<tr><td><strong>${esc(o.id)}</strong></td><td>${esc(o.client)}</td><td>${o.pieces}</td><td>${statusBadge(o.status)}</td><td><button class="action-btn" data-order="${esc(o.id)}">${o.status==='A separar'?'Separar pedido':o.status==='Separado'?'Marcar como enviado':'Ver detalhes'} ${icon('chevron','small-icon')}</button></td></tr>`).join('')}</tbody></table>${os.length?'':'<div class="empty">Nenhum pedido encontrado neste filtro.</div>'}</section>`}
function productsPage(){let ps=db.products.filter(p=>state.productFilter==='Todas'||p.category===state.productFilter).filter(p=>!state.search||(p.name+' '+p.id+' '+p.category+' '+p.color+' '+p.size).toLowerCase().includes(state.search.toLowerCase()));return `${header('Produtos','Cadastre roupas e mantenha tamanhos, cores e fotos organizados.',actionBtn('Novo produto','productNew','plus','primary'))}<div class="table-controls"><select id="product-filter" class="control-select" aria-label="Filtrar categoria"><option value="Todas">Todas as categorias</option>${db.categories.map(c=>`<option ${state.productFilter===c?'selected':''}>${esc(c)}</option>`).join('')}</select><span class="muted-sm">${ps.length} variações cadastradas</span><button class="btn sm" data-page="categorias">${icon('tag')} Categorias</button><button class="btn sm" data-page="tamanhos">${icon('shirt')} Tamanhos e cores</button></div><section class="panel table-panel"><table class="table"><thead><tr><th>Produto</th><th>Código</th><th>Categoria</th><th>Tamanho</th><th>Cor</th><th>Em estoque</th><th></th></tr></thead><tbody>${ps.map(p=>`<tr><td><div class="product-cell">${productThumb(p)}<div><strong>${esc(p.name)}</strong><small>${esc(p.supplier||'Sem fornecedor')}</small></div></div></td><td>${esc(p.id)}</td><td>${esc(p.category)}</td><td>${esc(p.size)}</td><td>${esc(p.color)}</td><td><span class="${p.stock<=p.min?'redmark strong':'strong'}">${p.stock} un.</span></td><td><button class="action-btn" data-edit-product="${esc(p.id)}">Editar</button></td></tr>`).join('')}</tbody></table>${ps.length?'':'<div class="empty">Nenhum produto encontrado.</div>'}</section>`}
function stockPage(){const ps=db.products.filter(p=>(state.stockCategory==='Todas'||p.category===state.stockCategory)&&(state.stockFilter!=='Baixo'||p.stock<=p.min)).filter(p=>!state.search||(p.name+' '+p.id+' '+p.size).toLowerCase().includes(state.search.toLowerCase()));return `${header('Estoque','Consulte quantidades, mínimos e faça correções de forma simples.',actionBtn('Registrar entrada','entryNew','down','primary'))}<div class="stat-strip"><div class="stat" data-filter-stock="Todos"><span>Peças no estoque</span><strong>${db.products.reduce((s,p)=>s+Number(p.stock),0)}</strong></div><div class="stat" data-filter-stock="Baixo"><span>Itens com estoque baixo</span><strong>${lowStock().length}</strong></div><div class="stat" data-page="categorias"><span>Categorias cadastradas</span><strong>${db.categories.length}</strong></div></div><div class="filter-row"><select id="stock-category" class="control-select"><option value="Todas">Todas as categorias</option>${db.categories.map(c=>`<option ${state.stockCategory===c?'selected':''}>${esc(c)}</option>`).join('')}</select><div class="tabs"><button class="tab ${state.stockFilter==='Todos'?'active':''}" data-filter-stock="Todos">Todos</button><button class="tab ${state.stockFilter==='Baixo'?'active':''}" data-filter-stock="Baixo">Estoque baixo</button></div></div><section class="panel table-panel"><table class="table"><thead><tr><th>Produto</th><th>Categoria</th><th>Variação</th><th>Quantidade</th><th>Mínimo</th><th>Situação</th><th>Ação</th></tr></thead><tbody>${ps.map(p=>`<tr><td><div class="product-cell">${productThumb(p)}<div><strong>${esc(p.name)}</strong><small>${esc(p.id)}</small></div></div></td><td>${esc(p.category)}</td><td>${esc(p.size)} · ${esc(p.color)}</td><td><strong>${p.stock} un.</strong></td><td>${p.min} un.</td><td>${p.stock<=p.min?'<span class="low-tag">Baixo</span>':'<span class="status ready">Normal</span>'}</td><td><button class="action-btn" data-stock="${esc(p.id)}">Ajustar</button></td></tr>`).join('')}</tbody></table>${ps.length?'':'<div class="empty">Nenhum item para este filtro.</div>'}</section>`}
function entriesPage(){return `${header('Entradas','Registre mercadorias recebidas e atualize o estoque.',actionBtn('Registrar entrada','entryNew','plus','primary'))}<div class="page-grid"><section class="panel">${panelTitle('Histórico de movimentações','clock')}<div class="movement-list">${db.movements.map(m=>`<div class="movement-row"><span class="movement-icon ${m.type==='saida'?'down':''}">${icon(m.type==='entrada'?'up':'down')}</span><div class="movement-content"><strong>${esc(m.description)}</strong><p>${esc(m.name)} · ${m.qty} unid.</p></div><span class="movement-time">${esc(m.time)}</span></div>`).join('')}</div></section><section class="panel section-panel"><h3>Conferência de mercadorias</h3><p class="muted" style="line-height:1.65">Ao registrar uma entrada, a quantidade é adicionada ao estoque e a operação aparece no histórico deste protótipo.</p><button class="btn black" data-action="entryNew">${icon('down')} Dar entrada agora</button></section></div>`}
function suppliersPage(){return `${header('Fornecedores','Contatos e parceiros cadastrados para a MÜD Store.',actionBtn('Novo fornecedor','supplierNew','plus','primary'))}<div class="full-grid">${db.suppliers.map(s=>`<button class="tile" data-supplier="${s.id}"><span class="tile-icon">${icon('people')}</span><span><strong>${esc(s.name)}</strong><small>${esc(s.type)}</small><small>${esc(s.contact)}</small></span></button>`).join('')}</div>`}
function categoriesPage(){return `${header('Categorias','Organize as coleções de roupas disponíveis na loja.',actionBtn('Nova categoria','categoryNew','plus','primary'))}<div class="full-grid">${db.categories.map((cat,i)=>{let count=db.products.filter(p=>p.category===cat).length,stock=db.products.filter(p=>p.category===cat).reduce((s,p)=>s+p.stock,0);return `<button class="tile" data-cat="${esc(cat)}"><span class="tile-icon">${icon(cat==='Camisetas'?'shirt':'layers')}</span><span><strong>${esc(cat)}</strong><small>${count} variações · ${stock} peças em estoque</small></span></button>`}).join('')}</div>`}
function sizesPage(){return `${header('Tamanhos e cores','Padronize as variações utilizadas no cadastro dos produtos.',actionBtn('Adicionar tamanho','sizeNew','plus','primary'))}<div class="page-grid"><section class="panel section-panel"><h3>Tamanhos disponíveis</h3><div style="display:flex;gap:9px;flex-wrap:wrap;margin-top:20px">${db.sizes.map(s=>`<span style="display:inline-block;padding:11px 17px;border:1px solid #e3e5e9;border-radius:10px;font-weight:650">${esc(s)}</span>`).join('')}</div></section><section class="panel section-panel"><h3>Cores em uso</h3><div style="display:flex;gap:9px;flex-wrap:wrap;margin-top:20px">${[...new Set(db.products.map(p=>p.color))].map(c=>`<span style="padding:11px 14px;border:1px solid #e3e5e9;border-radius:10px">${esc(c)}</span>`).join('')}</div><p class="muted-sm" style="margin-top:16px">As cores podem ser informadas no cadastro de cada produto.</p></section></div>`}
function reportsPage(){return `${header('Relatórios operacionais','Acompanhe pedidos, movimentações e quantidades — sem dados financeiros.',actionBtn('Exportar estoque','exportStock','download'))}<div class="stat-strip"><div class="stat"><span>Pedidos não enviados</span><strong>${db.orders.filter(o=>o.status!=='Enviado').length}</strong></div><div class="stat"><span>Peças em estoque</span><strong>${db.products.reduce((s,p)=>s+p.stock,0)}</strong></div><div class="stat"><span>Movimentações registradas</span><strong>${db.movements.length}</strong></div></div><div class="page-grid">${chartHtml()}${stockHome()}</div>`}
function settingsPage(){return `${header('Configurações','Preferências do protótipo e dados de demonstração.')}<div class="page-grid"><section class="panel section-panel"><h3>Sobre este protótipo</h3><p style="line-height:1.7;color:#6c717b">Esta é uma demonstração funcional do painel operacional da MÜD Store, desenvolvido como conceito de interface do WAXLO Commerce. Os dados ficam apenas neste navegador — não existe servidor ou conexão com vendas reais.</p><div class="note">O painel é exclusivo para a operação: pedidos, estoque, produtos, fornecedores e entradas. Não há lucro, faturamento ou saques nesta interface.</div></section><section class="panel section-panel"><h3>Restaurar dados de exemplo</h3><p class="muted" style="line-height:1.7">Use esta opção para voltar aos pedidos e produtos originais, apagando apenas as alterações feitas nesta demonstração local.</p><button class="btn" data-action="resetDemo">${icon('refresh')} Restaurar demonstração</button></section></div>`}
function render(){notify();document.getElementById('page').innerHTML=({inicio:home,pedidos:ordersPage,produtos:productsPage,estoque:stockPage,entradas:entriesPage,fornecedores:suppliersPage,categorias:categoriesPage,tamanhos:sizesPage,relatorios:reportsPage,configuracoes:settingsPage}[state.page]||home)()}
function navigate(p){state.page=p;state.search='';document.getElementById('global-search').value='';closePopover();document.getElementById('sidebar').classList.remove('open');render();window.scrollTo(0,0);try{history.replaceState(null,'','#'+p)}catch(e){}}
function toast(msg,type=''){let t=document.createElement('div');t.className='toast '+type;t.textContent=msg;document.getElementById('toasts').appendChild(t);setTimeout(()=>{t.style.opacity='0';setTimeout(()=>t.remove(),180)},3100)}
function openModal(title,subtitle,body,submitName='Salvar',handler=null,wide=false){const m=document.getElementById('modal');m.className='modal'+(wide?' lg':'');m.innerHTML=`<div class="modal-header"><div><h2>${title}</h2>${subtitle?`<p>${subtitle}</p>`:''}</div><button class="close-x" id="close-modal" aria-label="Fechar">${icon('close')}</button></div><form id="modal-form"><div class="modal-body">${body}</div><div class="modal-footer"><button type="button" class="btn" id="cancel-modal">Cancelar</button>${submitName?`<button type="submit" class="btn primary">${submitName}</button>`:''}</div></form>`;document.getElementById('overlay').classList.add('open');document.getElementById('close-modal').onclick=closeModal;document.getElementById('cancel-modal').onclick=closeModal;if(handler)document.getElementById('modal-form').onsubmit=e=>{e.preventDefault();handler(new FormData(e.currentTarget))};setTimeout(()=>m.querySelector('input,select,button')?.focus(),20)}
function closeModal(){document.getElementById('overlay').classList.remove('open')}
function f(label,name,type='text',value='',extra='',full=false){return `<div class="field ${full?'full':''}"><label for="f-${name}">${label}</label><input id="f-${name}" name="${name}" type="${type}" value="${esc(value)}" ${extra}></div>`}
function sel(label,name,options,value='',full=false){return `<div class="field ${full?'full':''}"><label for="f-${name}">${label}</label><select id="f-${name}" name="${name}">${options.map(o=>`<option value="${esc(o)}" ${o===value?'selected':''}>${esc(o)}</option>`).join('')}</select></div>`}
function compressImage(file){return new Promise((resolve,reject)=>{const url=URL.createObjectURL(file),im=new Image();im.onload=()=>{const w=im.naturalWidth,h=im.naturalHeight,max=550,scale=Math.min(1,max/Math.max(w,h));const canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(w*scale));canvas.height=Math.max(1,Math.round(h*scale));canvas.getContext('2d').drawImage(im,0,0,canvas.width,canvas.height);URL.revokeObjectURL(url);resolve(canvas.toDataURL('image/jpeg',.72))};im.onerror=()=>{URL.revokeObjectURL(url);reject(new Error('Imagem inválida'))};im.src=url})}
function productNew(id){let p=id?db.products.find(x=>x.id===id):null;openModal(p?'Editar produto':'Cadastrar produto',p?'Atualize os dados da variação cadastrada.':'Preencha os dados da roupa ou acessório.',`<div class="form-grid">${f('Nome do produto','name','text',p?.name||'','required',true)}${sel('Categoria','category',db.categories,p?.category||'Camisetas')}${sel('Tamanho','size',db.sizes,p?.size||'M')}${f('Cor','color','text',p?.color||'','required')}${f('Código (SKU)','id','text',p?.id||'','required '+(p?'readonly':''))}${f('Quantidade em estoque','stock','number',p?.stock??0,'min="0" step="1" required')}${f('Alerta de estoque mínimo','min','number',p?.min??5,'min="0" step="1" required')}${sel('Fornecedor','supplier',db.suppliers.map(x=>x.name),p?.supplier||db.suppliers[0]?.name||'')}${sel('Imagem ilustrativa','img',['Nenhuma','Camiseta preta','Camiseta off-white','Boné preto'],{preta:'Camiseta preta',offwhite:'Camiseta off-white',bone:'Boné preto'}[p?.img]||'Nenhuma')}<div class="field full"><label for="f-photo">Foto do produto (opcional)</label><input type="file" id="f-photo" name="photo" accept="image/*"><small class="muted-sm">A imagem é reduzida e salva localmente neste navegador.</small></div></div>`,p?'Salvar alterações':'Cadastrar produto',async form=>{let d=Object.fromEntries(form),sku=d.id.trim().toUpperCase();if(!p&&db.products.some(x=>x.id===sku)){toast('Este código já está cadastrado.','warn');return}if(!sku){toast('Informe um código para o produto.','warn');return}let v={id:sku,name:d.name.trim(),category:d.category,size:d.size,color:d.color.trim(),stock:Number(d.stock),min:Number(d.min),supplier:d.supplier,img:{'Camiseta preta':'preta','Camiseta off-white':'offwhite','Boné preto':'bone'}[d.img]||'',imageData:p?.imageData||null};let photo=form.get('photo');if(photo instanceof File&&photo.size){if(photo.size>12000000){toast('Escolha uma foto com menos de 12 MB.','warn');return}try{v.imageData=await compressImage(photo)}catch(e){toast('Não foi possível abrir esta imagem.','warn');return}}if(p)Object.assign(p,v);else db.products.push(v);persist();closeModal();toast(p?'Produto atualizado.':'Produto cadastrado.');render()},true)}
function orderModal(id){let o=db.orders.find(x=>x.id===id);if(!o)return;let body=`<div class="detail-dl"><div><dt>Cliente</dt><dd>${esc(o.client)}</dd></div><div><dt>Quantidade</dt><dd>${o.pieces} peças</dd></div><div><dt>Pedido</dt><dd>${esc(o.id)}</dd></div><div><dt>Status</dt><dd>${statusBadge(o.status)}</dd></div></div><h4>Peças do pedido</h4>${o.items.map(i=>`<div class="detail-items">${icon('box','small-icon')} ${esc(i)}</div>`).join('')}<div class="note" style="margin-top:18px">Este é um pedido de demonstração. O status pode ser alterado para testar o fluxo da loja.</div>`;const m=document.getElementById('modal');openModal(`Pedido ${esc(o.id)}`,'Conferência e separação do pedido.',body,'',null);const footer=m.querySelector('.modal-footer');footer.innerHTML='<button class="btn" type="button" id="cancel-modal">Fechar</button>'+(o.status!=='Enviado'?`<button type="button" class="btn primary" id="advance-order">${o.status==='A separar'?'Marcar como separado':'Marcar como enviado'}</button>`:'');document.getElementById('cancel-modal').onclick=closeModal;document.getElementById('advance-order')?.addEventListener('click',()=>{if(o.status==='A separar'){o.status='Separado';toast(`Pedido ${o.id} separado.`)}else if(o.status==='Separado'){o.status='Enviado';toast(`Pedido ${o.id} enviado.`);db.movements.unshift({id:Date.now(),type:'saida',name:`Pedido ${o.id}`,qty:o.pieces,description:'Pedido marcado como enviado',time:'Agora'})}persist();closeModal();render()})}
function stockAdjust(id){let p=db.products.find(x=>x.id===id);if(!p)return;openModal('Corrigir estoque',`Atualize a quantidade física de ${esc(p.name)} · Tam. ${esc(p.size)}.`,`<div class="note" style="margin-bottom:17px">Quantidade atual no sistema: <b>${p.stock} unidades</b>. Esta ação registra uma correção no histórico do protótipo.</div><div class="form-grid">${f('Nova quantidade','stock','number',p.stock,'min="0" required')}${f('Motivo da correção','reason','text','Conferência física','required')}</div>`,'Confirmar correção',form=>{const newQty=Number(form.get('stock'));const diff=newQty-p.stock;p.stock=newQty;db.movements.unshift({id:Date.now(),type:diff>=0?'entrada':'saida',name:p.name,qty:Math.abs(diff),description:`Correção de estoque: ${form.get('reason')}`,time:'Agora'});persist();closeModal();toast('Estoque corrigido.');render()})}
function entryNew(){openModal('Registrar entrada','Dê entrada nas mercadorias recebidas e atualize o estoque.','<div class="form-grid">'+sel('Produto','product',db.products.map(p=>`${p.id} · ${p.name} · ${p.size}`),'',true)+f('Quantidade recebida','qty','number',1,'min="1" required')+sel('Fornecedor','supplier',db.suppliers.map(s=>s.name))+f('Observação','obs','text','Mercadoria conferida','',true)+'</div>','Registrar entrada',form=>{const sku=String(form.get('product')).split(' · ')[0],p=db.products.find(x=>x.id===sku);if(!p){toast('Produto não encontrado.','warn');return}let q=Number(form.get('qty'));if(q<1){toast('Informe uma quantidade válida.','warn');return}p.stock+=q;db.movements.unshift({id:Date.now(),type:'entrada',name:p.name,qty:q,description:'Entrada de estoque',time:'Agora'});persist();closeModal();toast(`${q} peças adicionadas ao estoque.`);render()})}
function supplierNew(id){let s=id?db.suppliers.find(x=>x.id===id):null;openModal(s?'Editar fornecedor':'Novo fornecedor','Dados de contato do parceiro.','<div class="form-grid">'+f('Nome da empresa','name','text',s?.name||'','required',true)+f('Telefone','contact','tel',s?.contact||'','required')+f('E-mail','email','email',s?.email||'','required')+f('O que fornece','type','text',s?.type||'','required',true)+'</div>',s?'Salvar':'Cadastrar fornecedor',form=>{let v=Object.fromEntries(form);if(s)Object.assign(s,v);else db.suppliers.push({id:Date.now(),...v});persist();closeModal();toast('Fornecedor salvo.');render()})}
function categoryNew(){openModal('Nova categoria','Crie uma categoria para organizar produtos.',`<div class="form-grid">${f('Nome da categoria','name','text','','required',true)}</div>`,'Adicionar categoria',form=>{let name=String(form.get('name')).trim();if(db.categories.some(c=>c.toLowerCase()===name.toLowerCase())){toast('Categoria já existe.','warn');return}db.categories.push(name);persist();closeModal();toast('Categoria criada.');render()})}
function sizeNew(){openModal('Adicionar tamanho','Personalize a lista de tamanhos do cadastro.',`<div class="form-grid">${f('Tamanho','name','text','','required',true)}</div>`,'Adicionar tamanho',form=>{let n=String(form.get('name')).trim();if(db.sizes.includes(n)){toast('Tamanho já cadastrado.','warn');return}db.sizes.push(n);persist();closeModal();toast('Tamanho adicionado.');render()})}
function csvExport(kind){let rows=kind==='orders'?[['Pedido','Cliente','Peças','Status'],...db.orders.map(o=>[o.id,o.client,o.pieces,o.status])]:[['SKU','Produto','Categoria','Tamanho','Cor','Estoque'],...db.products.map(p=>[p.id,p.name,p.category,p.size,p.color,p.stock])];let csv='\ufeff'+rows.map(r=>r.map(x=>'"'+String(x).replaceAll('"','""')+'"').join(';')).join('\r\n');let blob=new Blob([csv],{type:'text/csv;charset=utf-8'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=`mud-${kind==='orders'?'pedidos':'estoque'}.csv`;a.click();setTimeout(()=>URL.revokeObjectURL(u),1500);toast('Arquivo CSV gerado.')}
function resetDemo(){openModal('Restaurar dados de demonstração','Isso apaga somente as alterações locais deste protótipo.','<div class="note">Pedidos, estoque e cadastros voltarão para o estado inicial de exemplo.</div>','Restaurar',()=>{db=structuredClone(DEMO);persist();closeModal();toast('Demonstração restaurada.');navigate('inicio')})}
function action(a){if(a.startsWith('nav:'))return navigate(a.slice(4));if(a==='productNew')return productNew();if(a==='entryNew')return entryNew();if(a==='supplierNew')return supplierNew();if(a==='categoryNew')return categoryNew();if(a==='sizeNew')return sizeNew();if(a==='exportOrders')return csvExport('orders');if(a==='exportStock')return csvExport('stock');if(a==='resetDemo')return resetDemo()}
function closePopover(){document.getElementById('popover').classList.remove('open')}
function popover(mode){const p=document.getElementById('popover');let open=p.classList.contains('open');if(open){closePopover();return}if(mode==='notifications')p.innerHTML='<h3>Notificações</h3><button class="submenu-item" data-page="pedidos">Você tem pedidos aguardando separação.</button><button class="submenu-item" data-page="estoque">Há produtos abaixo do estoque mínimo.</button>';else p.innerHTML='<h3>Hamud · MÜD Store</h3><p>Você está usando a demonstração do painel operacional.</p><button class="submenu-item" data-page="configuracoes">Configurações do protótipo</button>';p.classList.add('open')}
function searchInput(){const v=document.getElementById('global-search').value.trim();state.search=v;if(!v){if(['produtos','pedidos','estoque'].includes(state.page))render();closePopover();return}const prods=db.products.filter(p=>(p.name+p.id+p.category).toLowerCase().includes(v.toLowerCase())).slice(0,3);const ord=db.orders.filter(o=>(o.id+o.client).toLowerCase().includes(v.toLowerCase())).slice(0,3);const pop=document.getElementById('popover');pop.innerHTML='<h3>Resultados da busca</h3>'+prods.map(p=>`<button class="submenu-item" data-edit-product="${esc(p.id)}">${icon('tag','small-icon')} ${esc(p.name)} · ${esc(p.size)}</button>`).join('')+ord.map(o=>`<button class="submenu-item" data-order="${esc(o.id)}">${icon('orders','small-icon')} Pedido ${esc(o.id)} · ${esc(o.client)}</button>`).join('')+(!prods.length&&!ord.length?'<p>Nenhum resultado encontrado.</p>':'')+'<p>Pressione Enter para abrir a lista de produtos.</p>';pop.classList.add('open');if(['produtos','pedidos','estoque'].includes(state.page))render()}
document.addEventListener('click',e=>{const el=e.target.closest('[data-page],[data-action],[data-order],[data-stock],[data-cat],[data-supplier],[data-edit-product],[data-filter-order],[data-filter-stock]');if(!el){if(!e.target.closest('#popover,#notifications,#user-menu,#global-search-container'))closePopover();return}if(el.dataset.page){navigate(el.dataset.page);return}if(el.dataset.action){action(el.dataset.action);return}if(el.dataset.order){closePopover();orderModal(el.dataset.order);return}if(el.dataset.stock){stockAdjust(el.dataset.stock);return}if(el.dataset.editProduct){closePopover();productNew(el.dataset.editProduct);return}if(el.dataset.supplier){supplierNew(Number(el.dataset.supplier));return}if(el.dataset.cat){state.stockCategory=el.dataset.cat;state.stockFilter='Todos';navigate('estoque');return}if(el.dataset.filterOrder){state.orderTab=el.dataset.filterOrder;render();return}if(el.dataset.filterStock){state.stockFilter=el.dataset.filterStock;render();return}});
document.addEventListener('change',e=>{if(e.target.id==='product-filter'){state.productFilter=e.target.value;render()}if(e.target.id==='stock-category'){state.stockCategory=e.target.value;render()}});
document.getElementById('overlay').addEventListener('click',e=>{if(e.target.id==='overlay')closeModal()});
document.getElementById('mobile-menu').innerHTML=icon('menu');document.getElementById('mobile-menu').onclick=()=>document.getElementById('sidebar').classList.toggle('open');
document.getElementById('search-icon').innerHTML=icon('search');document.getElementById('bell-icon').innerHTML=icon('bell');document.getElementById('notifications').onclick=()=>popover('notifications');document.getElementById('user-menu').onclick=()=>popover('user');
document.getElementById('global-search').addEventListener('input',searchInput);document.getElementById('global-search').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();const q=e.target.value;navigate('produtos');state.search=q;document.getElementById('global-search').value=q;render();closePopover()}});
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();document.getElementById('global-search').focus();document.getElementById('global-search').select()}if(e.key==='Escape'){closeModal();closePopover();document.getElementById('sidebar').classList.remove('open')}});
document.getElementById('mud-logo').src=MEDIA.logo;
if(location.hash&&['inicio','pedidos','produtos','estoque','entradas','fornecedores','categorias','tamanhos','relatorios','configuracoes'].includes(location.hash.slice(1)))state.page=location.hash.slice(1);
render();
</script></body></html>
